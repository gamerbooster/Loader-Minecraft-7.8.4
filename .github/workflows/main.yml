name: NEXLoader 7.8.4 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Preparar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Instalar Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Buscar ZIP de NEXLoader 7.8.4
        shell: bash
        run: |
          set -euo pipefail

          ZIP="NEXLoader-7.8.4-java-android-source-FIXED.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: no se encontró $ZIP"
            echo "Archivos disponibles:"
            find . -maxdepth 2 -type f -printf '%p\n' | sort
            exit 1
          fi

          echo "ZIP encontrado:"
          ls -lh "$ZIP"

      - name: Extraer proyecto NEXLoader 7.8.4
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted

          unzip -q \
            "NEXLoader-7.8.4-java-android-source-FIXED.zip" \
            -d extracted

          PROJECT="$(
            find extracted \
              -mindepth 1 \
              -maxdepth 3 \
              -type f \
              -name VERSION \
              -print \
              -quit |
            sed 's#/VERSION$##'
          )"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: no se encontró VERSION dentro del ZIP"
            find extracted -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "Proyecto detectado:"
          echo "$PROJECT"

          test -f "$PROJECT/VERSION"
          test -f "$PROJECT/core/nex_convert.py"
          test -f "$PROJECT/tools/run_tests.py"
          test -f "$PROJECT/tools/check_versions.py"
          test -f "$PROJECT/tools/sync_android_core.py"
          test -f "$PROJECT/android/settings.gradle"
          test -f "$PROJECT/android/app/build.gradle"

          echo "NEX_PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Verificar versión 7.8.4
        shell: bash
        run: |
          set -euo pipefail

          cd "$NEX_PROJECT"

          VERSION="$(tr -d '[:space:]' < VERSION)"

          echo "Versión detectada: $VERSION"

          test "$VERSION" = "7.8.4"

          echo "VERSION CHECK: PASS"

      - name: Ejecutar suite de pruebas
        shell: bash
        run: |
          set -euo pipefail

          cd "$NEX_PROJECT"

          python tools/run_tests.py

      - name: Sincronizar core Python con Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$NEX_PROJECT"

          python tools/sync_android_core.py
      - name: Preparar VERSION para Gradle
        shell: bash
        run: |
          set -euo pipefail

          cp "$NEX_PROJECT/VERSION" "$NEX_PROJECT/android/VERSION"

          echo "VERSION copiada correctamente:"
          cat "$NEX_PROJECT/android/VERSION"

          test -f "$NEX_PROJECT/android/VERSION"
          
      - name: Verificar versiones sincronizadas
        shell: bash
        run: |
          set -euo pipefail

          cd "$NEX_PROJECT"

          python tools/check_versions.py

      - name: Auditar manifest Bedrock generado
        shell: bash
        run: |
          set -euo pipefail

          cd "$NEX_PROJECT"

          rm -rf /tmp/nex_ci_manifest_audit

          python core/nex_convert.py \
            examples/capdemo.jar \
            /tmp/nex_ci_manifest_audit

          python - <<'PY'
          from pathlib import Path
          import io
          import json
          import zipfile

          root = Path(".")
          out = Path("/tmp/nex_ci_manifest_audit")

          version = (
              root / "VERSION"
          ).read_text(
              encoding="utf-8"
          ).strip()

          addons = sorted(
              out.glob("*.mcaddon")
          )

          assert len(addons) == 1, addons

          addon = addons[0]

          print(
              "MCADDON generado:",
              addon
          )

          with zipfile.ZipFile(addon) as outer:

              names = set(
                  outer.namelist()
              )

              expected = {
                  "capdemo.behavior.mcpack",
                  "capdemo.resource.mcpack",
              }

              assert names == expected, names

              for name in sorted(names):

                  with zipfile.ZipFile(
                      io.BytesIO(
                          outer.read(name)
                      )
                  ) as inner:

                      manifest = json.loads(
                          inner.read(
                              "manifest.json"
                          ).decode(
                              "utf-8"
                          )
                      )

                      print(
                          "Manifest comprobado:",
                          name
                      )

                      assert "metadata" not in manifest, (
                          name,
                          manifest.get("metadata")
                      )

                      description = (
                          manifest[
                              "header"
                          ][
                              "description"
                          ]
                      )

                      expected_text = (
                          f"Generated by NEX Loader {version}"
                      )

                      assert (
                          expected_text
                          in description
                      ), description

          print(
              "FINAL MCADDON MANIFEST AUDIT: PASS"
          )
          PY

      - name: Preparar Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Compilar APK Debug
        shell: bash
        working-directory: ${{ env.NEX_PROJECT }}/android
        env:
          NEX_PYTHON_BIN: ${{ env.pythonLocation }}/bin/python
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace \
            --console=plain

      - name: Comprobar APK y versionName
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          cd "$NEX_PROJECT"

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -f "$APK"
          test -x "$AAPT"

          VERSION="$(
            tr -d '[:space:]' < VERSION
          )"

          ACTUAL="$(
            "$AAPT" dump badging "$APK" |
            sed -n \
              "s/.*versionName='\([^']*\)'.*/\1/p" |
            head -n 1
          )"

          echo "Versión esperada: $VERSION"
          echo "Versión encontrada en APK: $ACTUAL"

          test "$ACTUAL" = "$VERSION"

          OUT="android/app/build/outputs/apk/debug/NEXLoader-$VERSION-debug.apk"

          mv \
            "$APK" \
            "$OUT"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "APK final:"
          echo "$OUT"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXLoader-${{ steps.apk.outputs.version }}-debug
          path: ${{ env.NEX_PROJECT }}/android/app/build/outputs/apk/debug/NEXLoader-${{ steps.apk.outputs.version }}-debug.apk
          if-no-files-found: error

      - name: Subir información de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXLoader-7.8.4-build-info
          path: |
            ${{ env.NEX_PROJECT }}/VERSION
            ${{ env.NEX_PROJECT }}/BUILD_STATUS.md
          if-no-files-found: ignore
