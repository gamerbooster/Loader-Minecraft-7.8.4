name: NEXLoader 7.8.4 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Encontrar ZIP de NEXLoader 7.8.4
        shell: bash
        run: |
          set -euo pipefail

          ZIP="NEXLoader-7.8.4-java-android-source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encontró $ZIP"
            echo "Archivos disponibles:"
            ls -lah
            exit 1
          fi

          echo "ZIP encontrado:"
          ls -lh "$ZIP"

      - name: Extraer NEXLoader 7.8.4
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted

          unzip -q \
            "NEXLoader-7.8.4-java-android-source.zip" \
            -d extracted

          PROJECT="extracted/NEXLoader-7.8.4"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: No se encontró la carpeta NEXLoader-7.8.4"
            find extracted -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Proyecto encontrado:"
          echo "$PROJECT"

          test -f "$PROJECT/VERSION"
          test -f "$PROJECT/android/settings.gradle"
          test -f "$PROJECT/android/app/build.gradle"
          test -f "$PROJECT/core/nex_convert.py"

          echo "NEX_PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Verificar versión 7.8.4
        shell: bash
        run: |
          set -euo pipefail

          cd "$NEX_PROJECT"

          VERSION="$(cat VERSION | tr -d '[:space:]')"

          echo "Versión detectada: $VERSION"

          test "$VERSION" = "7.8.4"

          echo "VERSION CHECK PASS: $VERSION"

      - name: Ejecutar pruebas del conversor
        shell: bash
        run: |
          set -euo pipefail

          cd "$NEX_PROJECT"

          python -m unittest discover \
            -s core/tests \
            -p 'test*.py' \
            -v

      - name: Sincronizar core Python con Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$NEX_PROJECT"

          python tools/sync_android_core.py

      - name: Verificar versiones del proyecto
        shell: bash
        run: |
          set -euo pipefail

          cd "$NEX_PROJECT"

          python tools/check_versions.py

      - name: Auditar manifest Bedrock
        shell: bash
        run: |
          set -euo pipefail

          cd "$NEX_PROJECT"

          rm -rf /tmp/nex_manifest_test

          python core/nex_convert.py \
            examples/capdemo.jar \
            /tmp/nex_manifest_test

          python - <<'PY'
          from pathlib import Path
          import io
          import json
          import zipfile

          out = Path("/tmp/nex_manifest_test")

          addons = sorted(out.glob("*.mcaddon"))

          assert len(addons) == 1, addons

          addon = addons[0]

          print("MCADDON generado:", addon)

          with zipfile.ZipFile(addon) as outer:

              names = set(outer.namelist())

              assert "capdemo.behavior.mcpack" in names
              assert "capdemo.resource.mcpack" in names

              for name in [
                  "capdemo.behavior.mcpack",
                  "capdemo.resource.mcpack",
              ]:

                  with zipfile.ZipFile(
                      io.BytesIO(outer.read(name))
                  ) as inner:

                      manifest = json.loads(
                          inner.read("manifest.json").decode("utf-8")
                      )

                      print(
                          "Manifest comprobado:",
                          name
                      )

                      assert "metadata" not in manifest

                      description = manifest["header"]["description"]

                      assert "Generated by NEX Loader 7.8.4" in description

          print("MANIFEST CHECK PASS")
          PY

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Construir APK
        shell: bash
        working-directory: ${{ env.NEX_PROJECT }}/android
        env:
          NEX_PYTHON_BIN: ${{ env.pythonLocation }}/bin/python
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace \
            --console=plain

      - name: Comprobar versión real del APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$NEX_PROJECT"

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          VERSION="$(cat VERSION | tr -d '[:space:]')"

          ACTUAL="$(
            "$AAPT" dump badging "$APK" |
            sed -n "s/.*versionName='\([^']*\)'.*/\1/p" |
            head -n 1
          )"

          echo "Versión esperada: $VERSION"
          echo "Versión del APK: $ACTUAL"

          test "$ACTUAL" = "$VERSION"

          mkdir -p android/app/build/outputs/apk/debug

          mv \
            "$APK" \
            "android/app/build/outputs/apk/debug/NEXLoader-$VERSION-debug.apk"

          echo "APK correcto: NEXLoader-$VERSION-debug.apk"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXLoader-7.8.4-debug
          path: ${{ env.NEX_PROJECT }}/android/app/build/outputs/apk/debug/NEXLoader-7.8.4-debug.apk
          if-no-files-found: error

      - name: Subir información de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXLoader-7.8.4-build-info
          path: |
            ${{ env.NEX_PROJECT }}/VERSION
            ${{ env.NEX_PROJECT }}/BUILD_STATUS.md
          if-no-files-found: ignore
